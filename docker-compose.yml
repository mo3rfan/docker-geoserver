networks:
  geoserver_network:
    driver: bridge
volumes:
  gs_datadir:
  gs_context:
services:
  geoserver_master:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        GEOSERVER_WEBAPP_SRC: "https://sourceforge.net/projects/geoserver/files/GeoServer/2.27.1/geoserver-2.27.1-war.zip/download"
        PLUG_IN_PATHS: "resources/geoserver-plugins"
    deploy:
      replicas: 1
    restart: unless-stopped
    ports:
      - 8080
    networks:
      - geoserver_network
    volumes:
      - gs_datadir:/var/geoserver/datadir
      - gs_context:/gs_context/
  geoserver:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        GEOSERVER_WEBAPP_SRC: "https://sourceforge.net/projects/geoserver/files/GeoServer/2.27.1/geoserver-2.27.1-war.zip/download"
        PLUG_IN_PATHS: "resources/geoserver-plugins"
    deploy:
      replicas: 2
    ports:
      - 8080
    restart: unless-stopped
    networks:
      - geoserver_network
    volumes:
      - gs_datadir:/var/geoserver/datadir
      - gs_context:/gs_context/
  proxy:
    build:
      context: .
      dockerfile: ./Dockerfile.nginx
    restart: unless-stopped
    ports:
      - 80:80
    depends_on:
      - geoserver
    networks:
      - geoserver_network
